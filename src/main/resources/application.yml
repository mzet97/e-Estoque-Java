spring:
  application:
    name: e-estoque-api
  datasource:
    url: ${EESTOQUE_DB_URL:jdbc:postgresql://localhost:5432/e-estoque}
    username: ${EESTOQUE_DB_USERNAME:postgres}
    password: ${EESTOQUE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Colunas do schema .NET são "timestamp without time zone"
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${EESTOQUE_RABBITMQ_HOST:localhost}
    port: ${EESTOQUE_RABBITMQ_PORT:5672}
    username: ${EESTOQUE_RABBITMQ_USERNAME:guest}
    password: ${EESTOQUE_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
  data:
    redis:
      host: ${EESTOQUE_REDIS_HOST:localhost}
      port: ${EESTOQUE_REDIS_PORT:6379}
      password: ${EESTOQUE_REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${EESTOQUE_KEYCLOAK_ISSUER:http://localhost:8080/realms/e-estoque}

eestoque:
  keycloak:
    base-url: ${EESTOQUE_KEYCLOAK_URL:http://localhost:8080}
    realm: ${EESTOQUE_KEYCLOAK_REALM:e-estoque}
    client-id: ${EESTOQUE_KEYCLOAK_CLIENT_ID:e-estoque-client}
    client-secret: ${EESTOQUE_KEYCLOAK_CLIENT_SECRET:}
  messaging:
    exchange:
      notification: notification-service
  cache:
    reference-ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: true
    redis:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${EESTOQUE_OTLP_ENDPOINT:http://localhost:4317/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8080

logging:
  include-application-name: false
