name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, unit tests, architecture tests
        run: ./mvnw -B clean verify

      - name: Integration tests (Testcontainers)
        run: ./mvnw -B verify -DskipUT=false -Dgroups=integration
        continue-on-error: false

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t e-estoque-java:${{ github.sha }} .

      - name: Compose up (smoke)
        run: |
          cp .env.example .env
          docker compose up -d --build e-estoque-api || docker compose config
