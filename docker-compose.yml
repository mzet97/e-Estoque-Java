services:
  e-estoque-api:
    build: .
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EESTOQUE_DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-e-estoque}
      - EESTOQUE_DB_USERNAME=${POSTGRES_USER:-postgres}
      - EESTOQUE_DB_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - EESTOQUE_RABBITMQ_HOST=rabbitmq
      - EESTOQUE_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER:-dsv}
      - EESTOQUE_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS:?set in .env}
      - EESTOQUE_REDIS_HOST=redis
      - EESTOQUE_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - EESTOQUE_KEYCLOAK_URL=http://keycloak:8080
      - EESTOQUE_KEYCLOAK_ISSUER=http://localhost:8080/realms/e-estoque
      - EESTOQUE_KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?set in .env}
      - EESTOQUE_OTLP_ENDPOINT=http://tempo:4317/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - ob-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-e-estoque}
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ob-network

  pgadmin:
    image: dpage/pgadmin4:8.12
    ports:
      - "15432:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@e-estoque.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?set in .env}
    networks:
      - ob-network

  redis:
    image: redis:7.2
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ob-network

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-dsv}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?set in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ob-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER:-postgres}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms/my-realm.json:/opt/keycloak/data/import/my-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 15
    networks:
      - ob-network

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ob-network

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set in .env}
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - ob-network

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ob-network

  tempo:
    image: grafana/tempo:2.5.0
    ports:
      - "3200:3200"
      - "4317:4317"
    command: -config.file=/etc/tempo/local-config.yaml
    networks:
      - ob-network

networks:
  ob-network:
    driver: bridge

volumes:
  postgresql_data:
